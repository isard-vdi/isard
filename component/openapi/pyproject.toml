[project]
name = "isardvdi-openapi"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_openapi"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "musl-dev", "openssl-dev"]
apk-runtime = ["curl", "libffi", "openssl"]

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]
