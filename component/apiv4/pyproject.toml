[project]
name = "isardvdi-apiv4"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "bcrypt==5.0.0",
  "cachetools==7.1.4",
  "dnspython==2.8.0",
  "fastapi==0.139.0",
  "gevent==26.5.0",
  "html-sanitizer==2.6.0",
  "isardvdi-authentication-client",
  "isardvdi-common",
  "isardvdi-protobuf",
  "pillow==12.3.0",
  "portion==2.6.2",
  "pydantic==2.13.4",
  "pyjwt==2.13.0",
  "python-json-logger==4.1.0",
  "python-socketio==5.16.3",
  "pytz==2026.2",
  "redis==8.0.1",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/7de05d9a0d758e4b7fb7453849003a1e545446fe.tar.gz",
  "rq==2.10.0",
  "specktre==0.3.0",
  "uvicorn==0.51.0",
  "watchfiles==1.2.0",
  "websockets==16.1",
  "zstandard==0.25.0",
]

[dependency-groups]
test = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "rethinkdb-mock @ https://github.com/isard-vdi/rethinkdb-mock/archive/082aec0f78baa619e77bcb63d1f2fa6e2581e7a5.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "libjpeg-turbo-dev", "musl-dev", "openssl-dev", "zlib-dev"]
apk-runtime = ["libffi", "libjpeg-turbo", "openssh-client", "openssl", "ttf-liberation", "zlib"]
