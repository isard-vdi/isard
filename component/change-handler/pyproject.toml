[project]
name = "isardvdi-change-handler"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "isardvdi-changefeed-asyncapi",
  "isardvdi-common",
  "python-socketio==5.16.3",
  "redis==8.0.1",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/c1cfa75b2e27b2b3fac95dea67ec8e98a83dcb07.tar.gz",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_change_handler"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "musl-dev", "openssl-dev"]
apk-runtime = ["libffi", "openssl"]
