[project]
name = "isardvdi-common"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "bcrypt==5.0.0",
  "cachetools==7.1.4",
  "dnspython==2.8.0",
  "flask==3.1.3",
  "gevent==26.5.0",
  "hiredis==3.4.0",
  "html-sanitizer==2.6.0",
  "isardvdi-notifier-client",
  "isardvdi-protobuf",
  "isardvdi-scheduler-client",
  "pillow==12.3.0",
  "portion==2.6.2",
  "pydantic==2.13.4",
  "pyjwt==2.13.0",
  "python-json-logger==4.1.0",
  "python-socketio==5.16.3",
  "pytz==2026.2",
  "redis==8.0.1",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/c1cfa75b2e27b2b3fac95dea67ec8e98a83dcb07.tar.gz",
  "rq==2.10.0",
  "simple-colors==0.1.5",
  "specktre==0.3.0",
  "user-agents==2.2.0",
  "zstandard==0.25.0",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_common"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "libjpeg-turbo-dev", "musl-dev", "openssl-dev", "zlib-dev"]
apk-runtime = ["libffi", "libjpeg-turbo", "openssl", "zlib"]
