spec:
  inputs:
    use-image-build-cache:
      type: boolean
      default: true
    allow-protobuf-lint-failure:
      type: boolean
      default: false
---
# https://docs.gitlab.com/ee/ci/yaml/index.html#switch-between-branch-pipelines-and-merge-request-pipelines
workflow:
  # `auto_cancel_pending_pipelines` only kills a superseded pipeline's *pending*
  # jobs; the running ones keep burning the project's active-job budget until
  # they finish. This also cancels those, so the newer pipeline gets the slots.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS || $CI_COMMIT_TAG
      when: never
    - when: always

# https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#use-docker-in-docker
variables:
  # When you use the dind service, you must instruct Docker to talk with
  # the daemon started inside of the service. The daemon is available
  # with a network connection instead of the default
  # /var/run/docker.sock socket. Docker 19.03 does this automatically
  # by setting the DOCKER_HOST in
  # https://github.com/docker-library/docker/blob/d45051476babc297257df490d22cbd806f1b11e4/19.03/docker-entrypoint.sh#L23-L29
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/services/#accessing-the-services.
  #
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_HOST: tcp://docker:2376
  DOCKER_VERSION: "28"
  DOCKER_TLS_CERTDIR: "/certs"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  MAX_UNVERIFIED_CORES: "16"
  GOMODCACHE: "${CI_PROJECT_DIR}/.go-mod-cache"
  GOCACHE: "${CI_PROJECT_DIR}/.go-build-cache"
  # Same reason, and global rather than on the python template alone: the lint
  # jobs and test-integration cache `.uv-cache` too, and uv writing to its
  # default location inside the container made them re-resolve every dependency
  # — including the two fetched straight from a git forge — on every run.
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
  # Cache bun's content-addressed global install store (hash-verified, self-healing)
  # instead of the derived node_modules tree. A corrupt or truncated file inside a
  # cached node_modules (e.g. a 0-byte dependency file) otherwise persists across
  # pipelines forever, because the cache key is the lockfile hash and
  # `bun install --frozen-lockfile` reuses the restored tree without per-file
  # integrity checks. Caching the global store lets bun detect a bad entry by hash
  # and refetch it, rebuilding node_modules fresh each run.
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  # Secret Detection scans third-party Go module testdata fixtures (RSA/SSH keys,
  # AWS sample IDs, etc.) inside .go-mod-cache as critical findings. Those are
  # not project secrets — they ship inside dependency tarballs. Excluding the
  # dependency caches keeps the report focused on this repo's own code.
  SECRET_DETECTION_EXCLUDED_PATHS: ".go-mod-cache,.go-build-cache,vendor,node_modules,old-frontend/node_modules,component/frontend/node_modules,testing/e2e/node_modules"

default:
  # Every job only reads the tree or pushes SHA-tagged images, so cancelling one
  # mid-flight leaves nothing half-applied. Required by `auto_cancel` above.
  interruptible: true
  retry: 1
  cache: &global_cache
    - key:
        files:
          - go.mod
          - go.sum
      paths:
        - .go-mod-cache
        - .go-build-cache
    - key:
        files:
          - component/frontend/bun.lockb
          - old-frontend/bun.lock
      paths:
        - .bun-cache
    - key:
        files:
          - testing/e2e/package.json
          - testing/e2e/bun.lock
      paths:
        - testing/e2e/node_modules
    - key:
        files:
          - uv.lock
      paths:
        - .uv-cache

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - build-codegen
  - generate
  - unit-test
  - build
  - test
  - release
  - container-scan

commit-lint:
  stage: lint
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  before_script:
    - apk add --no-cache git
    - bun install --frozen-lockfile
  script:
    - git fetch https://gitlab.com/isard/isardvdi.git "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    - bunx commitlint --from=$(git merge-base HEAD FETCH_HEAD)

version:
  stage: lint
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  rules:
    # semantic-release checks repository write access and we cannot use
    # GITLAB_TOKEN in unprotected branches due to security reasons.
    # https://github.com/semantic-release/semantic-release/issues/2207
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
    - bun install --frozen-lockfile
  script:
    - bunx semantic-release --dry-run --branches $CI_COMMIT_REF_NAME
  artifacts:
    paths:
      - .VERSION

check-alloy-config:
  stage: lint
  image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
  before_script:
    - apk add --no-cache alloy make
  script:
    - make lint-alloy

# The uv cache is keyed on uv.lock, so whenever that changes — or whenever the
# cache configuration itself changes, which alters the key's index prefix — every
# python job starts with an empty cache and they all resolve the dependency set at
# the same moment. Two of those dependencies are source tarballs fetched straight
# from a git forge, and twenty simultaneous fetches of the same tarball is what
# that forge refuses, with `http2: refused stream`. The jobs then retry, in
# parallel, and hit the same wall.
#
# This job populates the cache once, and every consumer below only reads it. On a
# cold key one job fetches instead of twenty; on a warm key it resolves from the
# cache in seconds and costs nothing. Verified offline (`--network none`,
# `--offline`): with this cache present, `uv sync` for the consumer packages and
# for the dev group completes without touching the network at all.
#
# It syncs the packages the uv-image jobs actually name rather than
# `--all-packages`: the latter pulls in isardvdi-engine, whose libvirt-python
# needs headers this image does not carry, and whose suite runs in a different
# image anyway.
warm-uv-cache:
  stage: lint
  needs: []
  # Only this job writes the cache. If it fails the consumers still run, they just
  # resolve from the network as they did before.
  allow_failure: true
  retry: 2
  image: ghcr.io/astral-sh/uv:0.11.23-python3.14-alpine@sha256:43f1154bf7569ff82cab78d76ba6e6e553f99b6a2cc9c0b4c83615837f237650
  before_script:
    - apk add --no-cache git make
  script:
    - uv sync --frozen --no-dev --group test
      --package isardvdi-anonymize-db --package isardvdi-apiv4
      --package isardvdi-changefeed --package isardvdi-change-handler
      --package isardvdi-codegen --package isardvdi-common
      --package isardvdi-notifier --package isardvdi-openapi
      --package isardvdi-scheduler --package isardvdi-socketio
      --package isardvdi-storage --package isardvdi-vpn
      --package isardvdi-webapp
    - uv sync --frozen --only-group dev

.lint-uv-job:
  stage: lint
  needs: ["warm-uv-cache"]
  image: ghcr.io/astral-sh/uv:0.11.23-python3.14-alpine@sha256:43f1154bf7569ff82cab78d76ba6e6e553f99b6a2cc9c0b4c83615837f237650
  before_script:
    - apk add --no-cache make
    - uv sync --frozen --only-group dev

check-python:
  extends: .lint-uv-job
  script:
    - make lint-python

check-system-deps:
  extends: .lint-uv-job
  script:
    - make lint-system-deps

check-golang:
  stage: lint
  image: golangci/golangci-lint@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
  script:
    - make lint-go

check-frontend:
  stage: lint
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  parallel:
    matrix:
      - JOB: "format"
      - JOB: "lint"
      - JOB: "type-check"
        # TODO: Remove this when all type errors are fixed
        ALLOW_FAILURE: "true"
  rules:
    - if: $ALLOW_FAILURE == "true"
      allow_failure: true
    - if: $ALLOW_FAILURE != "true"
      allow_failure: false
  before_script:
    - apk add --no-cache make
  script:
    - make lint-frontend-$JOB

check-old-frontend:
  stage: lint
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  before_script:
    - apk add --no-cache make
  script:
    - make lint-old-frontend

check-protobuf:
  stage: lint
  image:
    name: bufbuild/buf:1.44.0@sha256:7e06f3027a16f8f63c25db6a1b5544866b677ad16e3907c14563c4a61d408228
    entrypoint: [""]
  allow_failure: $[[ inputs.allow-protobuf-lint-failure ]]
  # bufbuild/buf image is distroless, we can't install make
  # Commands match `make lint-protobuf`
  script:
    - buf lint
    - buf breaking --against https://gitlab.com/isard/isardvdi.git

docker-image-codegen:
  image: "docker:${DOCKER_VERSION}@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  stage: build-codegen
  services:
    - name: "docker:${DOCKER_VERSION}-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431"
  parallel:
    matrix:
      - DOCKERFILE: docker/codegen/Dockerfile
        IMAGE: codegen
  before_script:
    - timeout 300 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - |
      if $[[ inputs.use-image-build-cache ]]
      then
        CACHE_ARGS="--cache-from registry.gitlab.com/isard/isardvdi/$IMAGE:main --cache-to type=inline"
        if [ -n "$BUILDKIT_CACHE_REGISTRY" ]; then
          CACHE_ARGS="--cache-from $BUILDKIT_CACHE_REGISTRY/isard/isardvdi/$IMAGE:latest $CACHE_ARGS"
        fi
        docker build -f $DOCKERFILE $CACHE_ARGS -t $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG .
      else
        docker build -f $DOCKERFILE -t $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG .
      fi
    - docker tag $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG $CI_REGISTRY_IMAGE/$IMAGE:git-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE:git-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG
    - docker tag $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG $BUILDKIT_CACHE_REGISTRY/isard/isardvdi/$IMAGE:latest || true
    - docker push $BUILDKIT_CACHE_REGISTRY/isard/isardvdi/$IMAGE:latest || true

codegen:
  stage: generate
  image: "docker:${DOCKER_VERSION}@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  services:
    - name: "docker:${DOCKER_VERSION}-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431"
  before_script:
    - timeout 300 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    # under rootless dind the codegen container is not host root, and needs a writable tree
    - chmod -R a+rwX .
  script:
    - docker run -u $(id -u) -v "$(pwd):/build" "$CI_REGISTRY_IMAGE/codegen:git-$CI_COMMIT_SHORT_SHA"
    # gen.sh resolves node deps via NODE_PATH and must not touch the tracked
    # root package.json (older versions symlinked /deps manifests over it).
    - |-
      if [ ! -f package.json ] || [ -L package.json ]; then
        echo "ERROR: codegen removed or replaced the tracked root package.json"
        exit 1
      fi
    - |-
      untracked=$(git ls-files --others --exclude-standard)
      if ! git diff --quiet || [ -n "$untracked" ]; then
        echo "ERROR: codegen changed files that are committed to the repo."
        echo "Re-run codegen locally (bash build.sh) and commit the result."
        git diff --stat
        [ -n "$untracked" ] && printf 'new files:\n%s\n' "$untracked"
        exit 1
      fi
  artifacts:
    paths:
      - pkg/oas/apiv4/
      - pkg/gen
      - component/frontend/src/gen
      - testing/e2e/src/gen
      - "**/testing_*_mock.go"
      - component/apiv4-client/src/isardvdi_apiv4_client
      - component/authentication-client/src/isardvdi_authentication_client
      - component/notifier-client/src/isardvdi_notifier_client
      - component/scheduler-client/src/isardvdi_scheduler_client

docker-compose-build:
  stage: generate
  needs: []
  image: "docker:${DOCKER_VERSION}@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  services:
    - name: "docker:${DOCKER_VERSION}-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431"
  before_script:
    - apk add bash git docker-compose yq
  script:
    - cp isardvdi.cfg.example isardvdi.build.cfg
    - echo "DOCKER_IMAGE_PREFIX=${CI_REGISTRY_IMAGE}/" >> isardvdi.build.cfg
    - echo "DOCKER_IMAGE_TAG=$CI_COMMIT_REF_SLUG" >> isardvdi.build.cfg
    - echo "USAGE=build" >> isardvdi.build.cfg
    - echo "BASTION_ENABLED=true" >> isardvdi.build.cfg
    - echo "ENABLE_OPENAPI=true" >> isardvdi.build.cfg
    # Its part is off by default, and a service absent from the compose is an
    # image nothing can build.
    - echo "STORAGE_POOL_VDO_STATS=true" >> isardvdi.build.cfg
    - cp isardvdi.build.cfg isardvdi.infrastructure.build.cfg
    - echo "INFRASTRUCTURE_MANAGEMENT=true" >> isardvdi.infrastructure.build.cfg
    - cp isardvdi.build.cfg isardvdi.video-standalone.build.cfg
    - echo "FLAVOUR=video-standalone" >> isardvdi.video-standalone.build.cfg
    - cp isardvdi.build.cfg isardvdi.monitor.build.cfg
    - echo "FLAVOUR=monitor" >> isardvdi.monitor.build.cfg
    - cp isardvdi.build.cfg isardvdi.check.build.cfg
    - echo "FLAVOUR=check" >> isardvdi.check.build.cfg
    - BACKUP_DB_ENABLED=true CODEGEN=false ./build.sh
    - |-
      # Cache from the branch we are merging into (apiv4-integration today, main
      # after the apiv4->main cutover — self-adjusting), with :main as fallback.
      CACHE_REF="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_COMMIT_REF_SLUG:-main}}"
      # This job runs on ONE runner but the compose files it publishes are an
      # artifact consumed by every `docker-image` job, on EVERY runner. Writing
      # this runner's own BUILDKIT_CACHE_REGISTRY into cache_from therefore sent
      # the other runner's builds to a registry it has no insecure entry for,
      # which fails as `http: server gave HTTP response to HTTPS client` and
      # drops them to pulling cache manifests over the internet. Emit a
      # placeholder instead; each build resolves it to its OWN registry, which is
      # also the one it pushes to at the end of the job.
      for file in docker-compose*.yml; do
        cp "$file" "no-cache-$file"
        yq -i '.services |= map_values(.build.cache_from = [ "LOCAL_BUILDKIT_CACHE/isard/isardvdi/" + (.container_name | sub("isard-", "")) + ":latest", "registry.gitlab.com/isard/isardvdi/" + (.container_name | sub("isard-", "")) + ":'"$CACHE_REF"'", "registry.gitlab.com/isard/isardvdi/" + (.container_name | sub("isard-", "")) + ":main" ]) |= map_values(.build.cache_to = [ "type=inline" ])' $file
      done
  artifacts:
    paths:
      - docker-compose*.yml
      - no-cache-docker-compose*.yml

unit-test-go:
  stage: unit-test
  needs: ["codegen"]
  image: golang:1.25.8@sha256:3ac2864710f25e84381bf5d4272261c7ba73ada0339d62034df4de20dabb33ca
  before_script:
    - apt-get update && apt-get install -y libvirt-dev make
  script:
    - make ci-test-go
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# Behavioural unit tests for the storage-governor alert rules, run under the SAME
# engine the stack runs (vmalert / MetricsQL) — promtool green is not vmalert
# green, and the Go test above only checks that the rules NAME real metrics, not
# what they DO. Pinned to the vmalert-tool matching the runtime vmalert in
# docker-compose-parts/monitor.yml; the guard fails CI if the two ever drift, so
# this pin cannot silently diverge from what the stack actually runs.
unit-test-vmalert:
  stage: unit-test
  needs: []
  image:
    name: victoriametrics/vmalert-tool:v1.147.0
    entrypoint: [""]
  script:
    - runtime=$(grep -oE 'victoriametrics/vmalert:v[0-9.]+' docker-compose-parts/monitor.yml | head -1 | sed 's/.*://')
    - tool=$(/vmalert-tool-prod --version 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
    - '[ -n "$runtime" ] || { echo "FAIL: cannot read the runtime vmalert pin from docker-compose-parts/monitor.yml"; exit 1; }'
    - '[ "$runtime" = "$tool" ] || { echo "FAIL: vmalert-tool $tool != runtime vmalert $runtime (docker-compose-parts/monitor.yml) — bump this job image and monitor.yml together"; exit 1; }'
    - /vmalert-tool-prod unittest --files docker/vmalert/rules/storage_governor.test.yml

# Shared Python test config — uv cache dir cached via default cache entry.
.python-test-template:
  stage: unit-test
  needs: ["codegen", "warm-uv-cache"]
  image: ghcr.io/astral-sh/uv:0.11.23-python3.14-alpine@sha256:43f1154bf7569ff82cab78d76ba6e6e553f99b6a2cc9c0b4c83615837f237650
  before_script:
    - apk add --no-cache git make $EXTRA_APK_PACKAGES
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COVERAGE_DIR}/coverage.xml
      junit: ${COVERAGE_DIR}/report.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# The suites that assert on Redis's own behaviour — an rq job graph (hashes,
# dependency links, registries, Job.cancel), or a Lua script whose effect a
# mocked connection cannot report — are not unit tests and no longer live here.
# They are in testing/integration/redis/ and run against the stack's own
# isard-redis through test-integration, so no row below needs a Redis service.
#
# One row per Makefile PY_PKGS entry.
unit-test-python:
  extends: .python-test-template
  parallel:
    matrix:
      - COMPONENT: apiv4
        COVERAGE_DIR: component/apiv4
      - COMPONENT: common
        COVERAGE_DIR: component/_common
      - COMPONENT: change-handler
        COVERAGE_DIR: component/change-handler
      - COMPONENT: changefeed
        COVERAGE_DIR: component/changefeed
      - COMPONENT: socketio
        COVERAGE_DIR: component/socketio
      - COMPONENT: openapi
        COVERAGE_DIR: component/openapi
      - COMPONENT: notifier
        COVERAGE_DIR: notifier
      - COMPONENT: scheduler
        COVERAGE_DIR: scheduler
      - COMPONENT: webapp
        COVERAGE_DIR: webapp
      - COMPONENT: apiv4-client
        COVERAGE_DIR: component/apiv4-client
      - COMPONENT: vpn
        COVERAGE_DIR: docker/vpn
      - COMPONENT: storage
        COVERAGE_DIR: docker/storage
      - COMPONENT: codegen
        COVERAGE_DIR: docker/codegen
      - COMPONENT: anonymize-db
        COVERAGE_DIR: sysadm/anonymize-db
      - COMPONENT: hypervisor
        COVERAGE_DIR: docker/hypervisor
      - COMPONENT: backupninja
        COVERAGE_DIR: docker/backupninja
      - COMPONENT: engine
        COVERAGE_DIR: engine
        EXTRA_APK_PACKAGES: "build-base libvirt-dev musl-dev openssl-dev pciutils pkgconfig"
  script:
    - make ci-test-$COMPONENT

# The premises our code rests on that belong to somebody else's library: an rq
# admission rule, a Lua script's effect. Proved against the real dependency,
# because a fake would be a second implementation of the thing under test.
#
# Blocking, like a unit job, and separate from one for the same reason it is
# blocking: a test that needs a running server is not a unit test, and the unit
# jobs should not be declaring services to accommodate it. No stack here, only
# the dependency itself.
contract-test-redis:
  extends: .python-test-template
  services:
    - name: redis:7.4-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      alias: redis
  variables:
    REDIS_HOST: redis
  script:
    - make ci-test-contracts-redis
  artifacts:
    when: always
    reports:
      junit: testing/integration/redis/report.xml

contract-test-rethinkdb:
  # The nightly database backup path, run for real against a live RethinkDB.
  #
  # Nothing else in this pipeline ever executes a dump. docker-image builds the
  # backupninja image and no later job runs rethinkdb-dump against a server, so
  # a driver that cannot dump at all still produced a green pipeline — which is
  # how the Python 3.14 multiprocessing breakage reached a release branch.
  #
  # The service is what makes the suite run at all, not what makes it pass:
  # without ISARD_TEST_RETHINKDB the tests skip, and a skipped suite is the
  # green-having-asserted-nothing outcome the tests exist to prevent. Same image
  # and digest as the stack's own isard-db (docker/db/Dockerfile), so CI
  # exercises the server version production runs. The image's default command is
  # already `rethinkdb --bind all`, so no override is needed.
  extends: .python-test-template
  services:
    - name: rethinkdb:2.4.4-bookworm-slim@sha256:30e0235da35e645025ca755c50d9ba617765f7f186fd1b0879fe00177e14de6a
      alias: rethinkdb
  variables:
    ISARD_TEST_RETHINKDB: "rethinkdb:28015"
  script:
    - make ci-test-contracts-rethinkdb
  artifacts:
    when: always
    reports:
      junit: testing/integration/rethinkdb/report.xml

unit-test-webapp-js:
  # The webapp admin JS is served as plain files, so its suites are standalone
  # scripts run by the runtime rather than by a test framework.
  stage: unit-test
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  before_script:
    - apk add --no-cache make
  script:
    - make ci-test-webapp-js

unit-test-frontend:
  # Vue 3 (component/frontend) vitest unit suites. The specs vi.mock the
  # generated @/gen/oas/apiv4 client, but the alias must still resolve, so the
  # codegen-produced component/frontend/src/gen tree must be present.
  stage: unit-test
  needs: ["codegen"]
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  before_script:
    - apk add --no-cache make
  script:
    - make ci-test-frontend
  artifacts:
    when: always
    reports:
      junit: component/frontend/report.xml

unit-test-sparsify:
  # Recovery-trap suite for the sparsify utility (docker/storage/utils/tests).
  # Plain bash, no python and no generated code, but it drives real qcow2 files
  # and a live lock holder, so it needs qemu-img and qemu-io.
  stage: unit-test
  needs: []
  image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  before_script:
    - apk add --no-cache bash make qemu-img
  script:
    - make test-sparsify

unit-test-storage-utils:
  # Sparsify-backup classifier in the `storage` cleanup CLI
  # (docker/storage/utils/tests). Pure-stdlib pytest: the CLI is loaded via
  # importlib (it has no .py suffix) and the qemu-img calls its helpers share
  # are replaced, so no qemu binaries, no lock holder and no root are needed.
  extends: .python-test-template
  variables:
    COVERAGE_DIR: docker/storage/utils
  script:
    - make ci-test-storage-utils

docker-image:
  image: "docker:${DOCKER_VERSION}@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  stage: build
  needs:
    - docker-compose-build
    - codegen
  services:
    - name: "docker:${DOCKER_VERSION}-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431"
  parallel:
    matrix:
      - DOCKER_COMPOSE: build
        IMAGE: &containers
          - apiv4
          - changefeed
          - change-handler
          - scheduler
          - authentication
          - backupninja
          - bastion
          - db
          - engine
          - grafana
          - guac
          - hypervisor
          - notifier
          - openapi
          - sessions
          - socketio
          - squid
          - static
          - stats-go
          - stats-rethinkdb
          - storage
          - storage-vdo-stats
          - webapp
          - websockify
      - DOCKER_COMPOSE: build
        IMAGE: vpn
      - DOCKER_COMPOSE: build
        IMAGE: portal
      - DOCKER_COMPOSE: infrastructure.build
        IMAGE: orchestrator
      - DOCKER_COMPOSE: video-standalone.build
        IMAGE: video
      - DOCKER_COMPOSE: monitor.build
        IMAGE: monitor-proxy
      - DOCKER_COMPOSE: check.build
        IMAGE:
          - check
          - check-client
  before_script:
    - apk add git docker-compose
    - timeout 300 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - git submodule update --init --recursive
    - |
      if $[[ inputs.use-image-build-cache ]]
      then
        DOCKERCOMPOSE_FILE=docker-compose.$DOCKER_COMPOSE.yml
      else
        DOCKERCOMPOSE_FILE=no-cache-docker-compose.$DOCKER_COMPOSE.yml
      fi
    # Resolve the placeholder left by docker-compose-build to THIS runner's cache
    # registry — the one this job also pushes to below. If this runner has none,
    # drop the entry and fall back to the registry.gitlab.com refs.
    - |
      if [ -n "$BUILDKIT_CACHE_REGISTRY" ]; then
        sed -i "s#LOCAL_BUILDKIT_CACHE#$BUILDKIT_CACHE_REGISTRY#g" docker-compose*.yml
      else
        sed -i "/LOCAL_BUILDKIT_CACHE/d" docker-compose*.yml
      fi
    - echo $IMAGE_DEPENDENCY isard-$IMAGE | xargs -n1 docker-compose -f $DOCKERCOMPOSE_FILE build
    - docker tag $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG $CI_REGISTRY_IMAGE/$IMAGE:git-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE:git-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG
    - |
      if [ -n "$BUILDKIT_CACHE_REGISTRY" ]; then
        docker tag $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_REF_SLUG $BUILDKIT_CACHE_REGISTRY/isard/isardvdi/$IMAGE:latest
        docker push $BUILDKIT_CACHE_REGISTRY/isard/isardvdi/$IMAGE:latest
      fi

.real-deployment:
  stage: test
  when: manual
  timeout: 30m
  tags:
    - gpu
    - kvm
  needs: ["docker-image", "codegen"]
  allow_failure: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs-root"
  services:
    - name: "docker:${DOCKER_VERSION}-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
      variables:
        DOCKER_TLS_CERTDIR: "/certs-root"
      alias: docker
      entrypoint:
        - "sh"
        - "-c"
        - "apk add --no-cache fuse-overlayfs && exec dockerd-entrypoint.sh"
  image: "docker:${DOCKER_VERSION}@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  before_script:
    # Get dependencies:
    - |
      # git: build.sh
      # make: seeding the instance
      # libstdc++, libgcc: bun runtime
      apk add git make libstdc++ libgcc

    # Configure the instance
    - cp isardvdi.cfg.example isardvdi.e2e.cfg
    - cat testing/config/isardvdi.e2e.cfg.template >> isardvdi.e2e.cfg
    # CI-only vars appended by the runner
    - echo "DOCKER_IMAGE_PREFIX=${CI_REGISTRY_IMAGE}/" >> isardvdi.e2e.cfg
    - echo "DOCKER_IMAGE_TAG=git-$CI_COMMIT_SHORT_SHA" >> isardvdi.e2e.cfg
    - echo "FRONTEND_MODE=all" >> isardvdi.e2e.cfg
    # /dev/hugepages bind loses the hugetlbfs type through nested dind
    # layers; libvirtd's QEMU driver init aborts unless we point it at a
    # placeholder dir (the hypervisor never exercises hugepages in test).
    - mkdir -p /tmp/isard-real-hugepages
    - echo "HUGEPAGES_PATH=/tmp/isard-real-hugepages" >> isardvdi.e2e.cfg
    # Build the docker-compose file
    - CODEGEN=false ./build.sh
    # Start the instance
    - docker-compose -f docker-compose.e2e.yml pull --quiet
    - docker-compose -f docker-compose.e2e.yml up -d
  after_script:
    - docker-compose -f docker-compose.e2e.yml logs &> docker-compose.log

test-e2e:
  extends: .real-deployment
  before_script:
    - !reference [.real-deployment, before_script]
    ## Download bun
    - docker create --name bun-bin oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
    - docker cp bun-bin:/usr/local/bin/bun /usr/local/bin/bun
    - docker rm bun-bin
  script:
    - make test-e2e
  after_script:
    - !reference [.real-deployment, after_script]
    # Playwright writes [[ATTACHMENT|<path>]] relative to junit.xml; GitLab
    # resolves them from CI_PROJECT_DIR, so prepend the dir prefix.
    - |
      if [ -f testing/e2e/test-results/junit.xml ]; then
        sed -i 's#\[\[ATTACHMENT|#\[\[ATTACHMENT|testing/e2e/test-results/#g' testing/e2e/test-results/junit.xml
      fi
  artifacts:
    when: always
    paths:
      - docker-compose.log
      - testing/e2e/test-results/
      - testing/e2e/playwright-report/
    reports:
      junit: testing/e2e/test-results/junit.xml

test-integration:
  extends: .real-deployment
  # The shared scaffolding caches what test-e2e reads; this job runs no
  # `bun install` and does read the uv cache, through the project directory it
  # mounts into the uv container. `cache:` is a list, so this replaces rather
  # than extends the one .real-deployment declares.
  before_script:
    - !reference [.real-deployment, before_script]
  script:
    - make ci-test-integration
  artifacts:
    when: always
    paths:
      - docker-compose.log
    reports:
      junit: testing/integration/report.xml

gemnasium-dependency_scanning:
  variables:
    # Scan all the subdirectories
    DS_MAX_DEPTH: -1
    DS_INCLUDE_DEV_DEPENDENCIES: "false"
    DS_REMEDIATE: "false"

docker-tag:
  stage: release
  # Half of the images tagged and half not is a broken release, so this one
  # opts out of the `interruptible: true` default.
  interruptible: false
  image:
    name: gcr.io/go-containerregistry/crane:debug@sha256:1b1fb24d2b1bb27a9daf81a588157e68463876904e8e537a812edba6284fb252
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - IMAGE: *containers
      - IMAGE: &containers_extra
          - codegen
          - check
          - check-client
          - vpn
          - orchestrator
          - portal
          - video
          - monitor-proxy
  script:
    - test ! -e ".VERSION" && exit 0
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - crane tag $CI_REGISTRY_IMAGE/$IMAGE:git-$CI_COMMIT_SHORT_SHA v$(cat .VERSION | tr '.' '-')

release:
  stage: release
  # semantic-release pushes the tag and creates the release; cancelling it
  # mid-flight leaves one without the other, so it opts out of the default.
  interruptible: false
  image: oven/bun:1.3.13-alpine@sha256:4de475389889577f346c636f956b42a5c31501b654664e9ae5726f94d7bb5349
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git sed
    - bun install --frozen-lockfile
  script:
    - test ! -e ".VERSION" && exit 0
    - 'sed -i "s/^\(\s*DOCKER_IMAGE_TAG: \)$CI_DEFAULT_BRANCH$/\1v$(cat .VERSION | tr "." "-")/" docker-compose*.yml'
    - bunx semantic-release --branches $CI_DEFAULT_BRANCH

container_scanning:
  stage: container-scan
  needs:
    - job: docker-image
      artifacts: false
  variables:
    CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/$IMAGE
    CI_APPLICATION_TAG: $CI_COMMIT_REF_SLUG
  parallel:
    matrix:
      - IMAGE: *containers
      - IMAGE: *containers_extra
