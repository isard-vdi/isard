[project]
name = "isardvdi-webapp"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cachetools==7.1.4",
  "flask==3.1.3",
  "flask-login==0.6.3",
  "isardvdi-apiv4-client",
  "isardvdi-common",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/de0aa01a894bc08c3d8ecb9333bec2eafe9fd504.tar.gz",
  "waitress==3.0.2",
  "werkzeug==3.1.8",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock==3.15.1",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["webapp"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "libjpeg-turbo-dev", "musl-dev", "openssl-dev", "zlib-dev"]
apk-runtime = ["libffi", "libjpeg-turbo", "openssl", "yarn", "zlib"]
