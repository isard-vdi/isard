auth_enabled: false

server:
  http_listen_port: 3100
  # Loki caps a gRPC message at 4 MiB, and a query response that crosses it is
  # dropped on the query path: the panel renders empty rather than failing, so
  # the gap reads as "there are no logs".
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

query_scheduler:
  max_outstanding_requests_per_tenant: 4096

frontend:
  max_outstanding_per_tenant: 4096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    enabled: true
    dir: /data/wal                              # persistent volume: the default /loki/wal is lost on container recreation

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    - from: 2024-07-09
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

compactor:
  working_directory: /data/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

storage_config:
  boltdb_shipper:
    active_index_directory: /data/index
    cache_location: /data/boltdb-cache
  tsdb_shipper:
    active_index_directory: /data/index
    cache_location: /data/index_cache
  filesystem:
    directory: /data/saved

limits_config:
  # The log panels page through far more than the 5000-entry default, and going
  # over truncates the result with no visible sign that it did.
  max_entries_limit_per_query: 50000000000
