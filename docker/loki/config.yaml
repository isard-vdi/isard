auth_enabled: false

server:
  http_listen_port: 3100
  # info logs every query, and the alert rules alone query it thousands of times a day
  log_level: warn
  # Loki caps a gRPC message at 4 MiB, and a query response that crosses it is
  # dropped on the query path: the panel renders empty rather than failing, so
  # the gap reads as "there are no logs".
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

query_scheduler:
  max_outstanding_requests_per_tenant: 4096

frontend:
  max_outstanding_per_tenant: 4096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    enabled: true
    dir: /data/wal                              # persistent volume: the default /loki/wal is lost on container recreation

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    - from: 2024-07-09
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

compactor:
  working_directory: /data/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

storage_config:
  boltdb_shipper:
    active_index_directory: /data/index
    cache_location: /data/boltdb-cache
  tsdb_shipper:
    active_index_directory: /data/index
    cache_location: /data/index_cache
  filesystem:
    directory: /data/saved

limits_config:
  # Over the 5000-entry default a log panel is truncated with no visible sign.
  max_entries_limit_per_query: 100000
  # Per-session frontend panels group by session_id, well past the default 500.
  max_query_series: 5000
  # Senders replay their WAL in one burst after an outage.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 32MB
