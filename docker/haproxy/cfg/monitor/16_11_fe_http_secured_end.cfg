### START 16_11_fe_http_secured_end.cfg ###
  # Loki and VictoriaMetrics are never published: the stack reaches them on the
  # docker and infrastructure networks, and people read them through Grafana
  http-request deny deny_status 404 if { path,url_dec -m reg -i ^/+(loki|victoriametrics|prometheus)(/|$) }

  # Grafana's own metrics need an admin token
  use_backend be_isard-grafana-metrics if { path,url_dec -m reg -i ^/monitor/+(\./+)*metrics/*$ }

  # Grafana backend
  use_backend be_isard-grafana if { path_beg /monitor } or { path_beg /monitor/ }
### END 16_11_fe_http_secured_end.cfg ###
