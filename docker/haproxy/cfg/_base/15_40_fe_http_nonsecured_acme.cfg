### START 15_40_fe_http_nonsecured_acme.cfg ###
  # Let's encrypt
  #
  # Reads the process variable rather than ${ACME_ACCOUNT_THUMBPRINT} directly.
  # The environment form is substituted at PARSE time, so the answer to every
  # challenge was fixed to whatever the account file held when the container
  # started -- an account registered later produced challenges this responder
  # could never satisfy, and a reload would not pick it up either, because a
  # reload re-executes with the same environment. The variable can be written
  # over the admin socket, so haproxy-sync puts the current thumbprint in place
  # before each issuance.
  http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[var(proc.acme_thumbprint)]\n" if { path_beg '/.well-known/acme-challenge/' }
### END 15_40_fe_http_nonsecured_acme.cfg ###
