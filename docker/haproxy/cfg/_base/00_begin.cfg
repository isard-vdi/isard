### START 00_begin.cfg ###
resolvers mydns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

global
    daemon
    log stdout len 4096 format raw local0
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 2m
    # Buffer tuning
    tune.bufsize 32768
    tune.maxrewrite 4096
    # SSL tuning
    tune.ssl.cachesize 50000
    tune.ssl.lifetime 600
    tune.ssl.capture-buffer-size 96
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11
    # Compression tuning
    tune.comp.maxlevel 1
    set-var proc.http_port env(HTTP_PORT)
    set-var proc.https_port env(HTTPS_PORT)
    set-var proc.bastion_enabled env(BASTION_ENABLED)
    set-var proc.bastion_ssh_port env(BASTION_SSH_PORT)
    set-var proc.forbid_domain_ip env(FORBID_DOMAIN_IP)
    set-var proc.usage env(USAGE)
    set-var proc.faro_enabled env(FARO_ENABLED)

defaults common
  timeout         connect 3s
  timeout         client 15s
  timeout         client-fin 20s
  timeout         server 25s
  timeout         tunnel 7200s
  maxconn         16384
  option          tcpka
  option          persist
  timeout tarpit  12s
  .if defined(HAPROXY_LOGGING)
    log global
    # Connection errors before a stream exists (TLS handshake, PROXY protocol)
    error-log-format "%{+json}o %(time)t %(src)[src] %(frontend)ft %(conn_error)[fc_err_str] %(tls)sslv %(tls_error)[ssl_fc_err_str] %(t_handshake_ms:sint)Th %(rtt_ms:sint)[fc_rtt]"
  .endif

defaults tcp_defaults from common
  mode tcp
  .if defined(HAPROXY_LOGGING)
    log-format "%{+json}o %(time)t %(src)[src] %(src_port:sint)[src_port] %(frontend)ft %(backend)b %(server)s %(term)ts %(t_handshake_ms:sint)Th %(t_queue_ms:sint)Tw %(t_connect_ms:sint)Tc %(t_total_ms:sint)Tt %(bytes_out:sint)B %(bytes_in:sint)U %(conn_process:sint)ac %(conn_frontend:sint)fc %(conn_backend:sint)bc %(conn_server:sint)sc %(retries:sint)rc %(queue_server:sint)sq %(queue_backend:sint)bq %(rtt_ms:sint)[fc_rtt] %(rttvar_ms:sint)[fc_rttvar] %(retrans:sint)[fc_retrans] %(lost:sint)[fc_lost] %(backend_rtt_ms:sint)[bc_rtt] %(conn_error)[fc_err_str] %(tls)sslv %(tls_error)[ssl_fc_err_str] %(block)[var(txn.block)]"
  .endif

defaults http_defaults from common
  mode http
  # NOTE: `option forwardfor` writes X-Forwarded-For using the TCP-level
  # source IP haproxy sees. If docker's userland-proxy is enabled on the
  # host (default), every external client appears as the docker bridge
  # gateway (e.g. 172.31.255.1), so logged client IPs are meaningless.
  # To preserve real client IPs, set `"userland-proxy": false` in
  # /etc/docker/daemon.json and restart docker, or front isard-portal
  # with a host-level proxy that speaks PROXY protocol to the
  # `accept-proxy` bind already defined on the TCP frontends.
  option          forwardfor
  http-reuse always
  compression algo gzip
  compression type text/html text/plain text/css application/json application/javascript image/svg+xml
  .if defined(HAPROXY_LOGGING)
    log-format "%{+json}o %(time)t %(src)[src] %(src_port:sint)[src_port] %(frontend)ft %(backend)b %(server)s %(method)[capture.req.method] %(path)[capture.req.uri,field(1,?)] %(status:sint)ST %(term)tsc %(t_handshake_ms:sint)Th %(t_idle_ms:sint)Ti %(t_request_ms:sint)TR %(t_queue_ms:sint)Tw %(t_connect_ms:sint)Tc %(t_response_ms:sint)Tr %(t_active_ms:sint)Ta %(t_user_ms:sint)Tu %(t_total_ms:sint)Tt %(bytes_out:sint)B %(bytes_in:sint)U %(conn_process:sint)ac %(conn_frontend:sint)fc %(conn_backend:sint)bc %(conn_server:sint)sc %(retries:sint)rc %(queue_server:sint)sq %(queue_backend:sint)bq %(backend_rtt_ms:sint)[bc_rtt] %(glitches:sint)[fc_glitches] %(block)[var(txn.block)]"
  .endif
### END 00_begin.cfg ###
