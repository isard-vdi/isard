### START 20_be_monitor.cfg (monitor-remote) ###
backend be_isard-grafana from http_defaults
  timeout server 300s
  http-request set-header X-JWT-Assertion %[req.cook(isardvdi_session),regsub("^Bearer ","")]
  server isard-grafana "${GRAFANA_HOST}":3000 maxconn 10 check port 3000 inter 15s rise 2 fall 3  resolvers mydns init-addr none
### END 20_be_monitor.cfg (monitor-remote) ###
