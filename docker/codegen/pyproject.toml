[project]
name = "isardvdi-codegen"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "grpcio-tools==1.82.1",
  "pyyaml==6.0.3",
  "openapi-python-client==0.29.0",
  "ruff==0.15.21",
  "docopt>=0.6.2",
  "specktre==0.3.0",
]

[dependency-groups]
test = [
  "pytest",
  "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
