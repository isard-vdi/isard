[project]
name = "isardvdi-codegen"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "grpcio-tools==1.82.1",
  "pyyaml==6.0.3",
  "openapi-python-client==0.29.0",
  "ruff==0.15.21",
  "docopt>=0.6.2",
  "specktre==0.3.0",
]

[project.scripts]
gen-changefeed-asyncapi = "isardvdi_codegen.gen_changefeed_asyncapi:main"
gen-changefeed-subscribers = "isardvdi_codegen.gen_changefeed_subscribers:main"

[dependency-groups]
test = [
  "pydantic",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_codegen"]
