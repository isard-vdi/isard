[project]
name = "isardvdi-db"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/7de05d9a0d758e4b7fb7453849003a1e545446fe.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
