[project]
name = "isardvdi-db"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/0bbd7ff5363f70739ae0ef1074f864a81e8c0df6.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Dependency-only member: it ships no Python module of its own. The venv exists
# solely so the rethinkdb wheel's rethinkdb-dump / rethinkdb-restore console
# scripts are on PATH inside the isard-db container (see sysadm/anonymize-db,
# which shells out to `docker exec isard-db rethinkdb-restore`).
bypass-selection = true
