[project]
name = "isardvdi-backupninja"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "isardvdi-apiv4-client",
  "isardvdi-common",
  "pyjwt==2.13.0",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/0bbd7ff5363f70739ae0ef1074f864a81e8c0df6.tar.gz",
]

[project.scripts]
isardvdi-backupninja-report = "isardvdi_backupninja.backup_report:main"
isardvdi-backupninja-integrity-enabled = "isardvdi_backupninja.get_integrity_enabled:main"
isardvdi-backup-pool-paths = "isardvdi_backupninja.pool_paths:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_backupninja"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "libjpeg-turbo-dev", "musl-dev", "openssl-dev", "zlib-dev"]
apk-runtime = ["bash", "borgbackup~1.4", "coreutils", "curl", "envsubst", "flock", "jq", "libffi", "libjpeg-turbo", "logrotate", "nfs-utils", "openssl", "redis", "zlib"]
