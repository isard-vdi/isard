[project]
name = "isardvdi-vpn"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "isardvdi-apiv4-client",
  "isardvdi-changefeed-asyncapi",
  "isardvdi-common",
  "pyjwt==2.13.0",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/0bbd7ff5363f70739ae0ef1074f864a81e8c0df6.tar.gz",
]

[project.scripts]
isardvdi-vpn-admin = "isardvdi_vpn.wgadmin:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_vpn"]

[tool.isardvdi.system-deps]
apk-build = ["autoconf", "automake", "build-base", "git", "libffi-dev", "libtool", "linux-headers", "musl-dev", "openssl-dev", "python3-dev"]
apk-runtime = ["conntrack-tools", "dnsmasq", "guacamole-server@community", "guacamole-server-dev@community", "guacamole-server-rdp@community", "iptables", "libffi", "openssh", "openssl", "openvswitch", "wireguard-tools"]
