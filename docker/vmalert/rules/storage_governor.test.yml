# promtool unit tests for storage_governor.rules.yml
#
# Run: promtool test rules docker/vmalert/rules/storage_governor.test.yml
#
# These prove the tricky, easy-to-get-wrong behaviours:
#   * OldestQueuedAgeHigh fires per-tier (interactive at 301 not 299; a standard
#     lane at 301 does NOT fire because its SLA is 900; a background lane fires
#     only past 21600) — a dropped {tier=} matcher would be caught.
#   * StrandedLane fires only when the `stranded_lane` series is present.
#   * A per-category alert (CategoryAtCap) does NOT fire when multitenancy_active
#     is 0 or absent; CategoryStarved fires only when fully gated.
#   * FailedSpike does NOT fire on a big registry shrink (30 -> 0): increase()
#     reset-compensation + clamp_min neutralise it even above the crit threshold.
#   * PSIPinned fires only for the worker actually over psi_limit (group_left join).
#   * WorkerHeartbeatLost / NoStorageWorkers fire within their for: 2m window.
#   * TaskStreamLagStuck does NOT fire on a lag FIVE TIMES its threshold held for
#     25 minutes and then drained. That case is the whole design: amplitude
#     cannot separate a healthy burst from a stall on this signal (measured
#     healthy peaks 261-673, incident 892), so the rule discriminates on the 30m
#     `for:`. Lower the `for:` and that case starts failing.
#   * WorkerHeartbeatLost does NOT fire for a registration whose rq:worker hash
#     is gone -- remove the hash_present gate and that case fails.
#   * TaskStreamDeadLettering does not fire on a TRIM of the dead stream, the
#     same anti-shrink guarantee FailedSpike has.
#   * TaskStreamsUnreadable stays quiet while Redis is down (RedisDown's job).

rule_files:
  - storage_governor.rules.yml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # OldestQueuedAgeHigh interactive: below the 300s threshold -> no alert.
  # ---------------------------------------------------------------------------
  - name: oldest_queued_interactive_below_sla_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_oldest_queued_age_seconds{pool="default",category="_pool",tier="interactive"}'
        values: "299 299 299 299 299"
    alert_rule_test:
      - eval_time: 4m
        groupname: storage_governor_alerts
        alertname: OldestQueuedAgeHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # OldestQueuedAgeHigh interactive: 301s > 300s threshold -> fires immediately.
  # ---------------------------------------------------------------------------
  - name: oldest_queued_interactive_over_sla_fires_at_301
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_oldest_queued_age_seconds{pool="default",category="_pool",tier="interactive"}'
        values: "301 301 301 301 301"
    alert_rule_test:
      - eval_time: 4m
        groupname: storage_governor_alerts
        alertname: OldestQueuedAgeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: default
              category: _pool
              tier: interactive
            exp_annotations:
              summary: "Oldest queued job exceeds its tier SLA"
              description: "Lane default/_pool/interactive head job has been queued for 301s, past its tier SLA (interactive 300s / standard 900s / bulk 7200s / background 21600s). Inspect head-task drawer and consumer coverage."

  # ---------------------------------------------------------------------------
  # Per-tier routing: a STANDARD lane at 301s must NOT fire (its SLA is 900s).
  # Catches a regression that let the interactive threshold apply fleet-wide.
  # ---------------------------------------------------------------------------
  - name: oldest_queued_standard_at_301_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_oldest_queued_age_seconds{pool="default",category="_pool",tier="standard"}'
        values: "301 301 301 301 301"
    alert_rule_test:
      - eval_time: 4m
        groupname: storage_governor_alerts
        alertname: OldestQueuedAgeHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Per-tier routing: a BACKGROUND lane fires only past its 21600s SLA.
  # ---------------------------------------------------------------------------
  - name: oldest_queued_background_over_sla_fires
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_oldest_queued_age_seconds{pool="default",category="9a3b",tier="background"}'
        values: "21601 21601 21601"
    alert_rule_test:
      - eval_time: 2m
        groupname: storage_governor_alerts
        alertname: OldestQueuedAgeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: default
              category: 9a3b
              tier: background
            exp_annotations:
              summary: "Oldest queued job exceeds its tier SLA"
              description: "Lane default/9a3b/background head job has been queued for 21601s, past its tier SLA (interactive 300s / standard 900s / bulk 7200s / background 21600s). Inspect head-task drawer and consumer coverage."

  # ---------------------------------------------------------------------------
  # StrandedLane requires the `stranded_lane` series to be present. With backlog
  # only (coverage unknown -> series suppressed), it must NOT fire.
  # ---------------------------------------------------------------------------
  - name: stranded_lane_no_series_present_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_backlog{pool="oldpool",category="_pool",tier="background"}'
        values: "27x14"
    alert_rule_test:
      - eval_time: 12m
        groupname: storage_governor_alerts
        alertname: StrandedLane
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # StrandedLane WITH the series present + backlog>0 -> fires after for: 10m.
  # ---------------------------------------------------------------------------
  - name: stranded_lane_series_present_fires_after_10m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_backlog{pool="oldpool",category="_pool",tier="background"}'
        values: "27x14"
      - series: 'isardvdi_storage_governor_stranded_lane{pool="oldpool",category="_pool",tier="background"}'
        values: "27x14"
    alert_rule_test:
      - eval_time: 12m
        groupname: storage_governor_alerts
        alertname: StrandedLane
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: oldpool
              category: _pool
              tier: background
            exp_annotations:
              summary: "Stranded storage lane: backlog with no consumer"
              description: "Lane oldpool/_pool/background has backlog but no live consumer (coverage known) for 10m. Start/scale a worker for that pool/tier; confirm producer intent."

  # ---------------------------------------------------------------------------
  # Per-category gating: CategoryAtCap must NOT fire when multitenancy_active==0.
  # ---------------------------------------------------------------------------
  - name: category_at_cap_multitenancy_zero_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_category_at_cap{pool="default",category="9a3b"}'
        values: "1x25"
      - series: 'isardvdi_storage_governor_multitenancy_active'
        values: "0x25"
    alert_rule_test:
      - eval_time: 24m
        groupname: storage_governor_alerts
        alertname: CategoryAtCap
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Per-category gating: CategoryAtCap must NOT fire when multitenancy_active is
  # ABSENT (absence must never read as a flat/healthy install).
  # ---------------------------------------------------------------------------
  - name: category_at_cap_multitenancy_absent_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_category_at_cap{pool="default",category="9a3b"}'
        values: "1x25"
    alert_rule_test:
      - eval_time: 24m
        groupname: storage_governor_alerts
        alertname: CategoryAtCap
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # CategoryStarved fires only when fully gated: starved==1 AND
  # multitenancy_active==1 AND a worker is up (worker_up:sum>0), held 15m.
  # ---------------------------------------------------------------------------
  - name: category_starved_gated_fires_after_15m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_category_starved{pool="default",category="9a3b"}'
        values: "1x20"
      - series: 'isardvdi_storage_governor_multitenancy_active'
        values: "1x20"
      - series: 'isardvdi_storage_governor_worker_up{worker="storage.default.background.def456",pool="default",kind="elastic"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: storage_governor_alerts
        alertname: CategoryStarved
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: default
              category: 9a3b
            exp_annotations:
              summary: "Per-category storage lane is starved"
              description: "Category 9a3b in pool default has backlog but no inflight for 15m while peers run and a worker is alive. Raise its weight/cap or lower a hogging category."

  # ---------------------------------------------------------------------------
  # FailedSpike anti-shrink: a registry that only SHRINKS from a large value
  # (auto-delete of 30 failed jobs -> 0) must NOT fire, even though 30 is above
  # the crit threshold. increase() reset-compensates the drop to ~0 and clamp_min
  # pins it non-negative, so neither warn (>5) nor crit (>20) fires. This is the
  # real anti-shrink guarantee (the previous 4->0 case was below warn anyway and
  # proved nothing).
  # ---------------------------------------------------------------------------
  - name: failed_spike_large_shrink_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_failed{pool="default",category="9a3b",tier="background"}'
        values: "30 30 30 30 30 30 30 30 30 30 30 30 30 0 0 0"
    alert_rule_test:
      - eval_time: 15m
        groupname: storage_governor_alerts
        alertname: FailedSpike
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # PSIPinned fires ONLY for the worker actually over psi_limit. Two workers both
  # deferring; workerA psi_cpu 80 > limit 40, workerB psi_cpu 10 < 40. The
  # group_left() join must select only workerA.
  # ---------------------------------------------------------------------------
  - name: psi_pinned_only_over_limit_worker_fires
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_deferring{worker="workerA"}'
        values: "1x20"
      - series: 'isardvdi_storage_governor_worker_deferring{worker="workerB"}'
        values: "1x20"
      - series: 'isardvdi_storage_governor_worker_psi_cpu{worker="workerA"}'
        values: "80x20"
      - series: 'isardvdi_storage_governor_worker_psi_cpu{worker="workerB"}'
        values: "10x20"
      - series: 'isardvdi_storage_governor_psi_limit'
        values: "40x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: storage_governor_alerts
        alertname: PSIPinned
        exp_alerts:
          - exp_labels:
              severity: warning
              worker: workerA
            exp_annotations:
              summary: "Storage worker pinned by PSI pressure"
              description: "Worker workerA has been deferring under CPU/IO/memory pressure above psi_limit for 15m (held by host stall, not the cap). The worker defers on any of the three axes, so all three are admitted here. Investigate storage-host load; scale the node or raise psi_limit only if the pressure is acceptable."

  # ---------------------------------------------------------------------------
  # A memory-PSI defer pins the deferrable tiers exactly like a CPU or IO one,
  # so the alert has to admit that axis too: cpu and io below the limit, mem
  # above it, worker deferring.
  # ---------------------------------------------------------------------------
  - name: psi_pinned_fires_on_memory_pressure_alone
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_deferring{worker="workerM"}'
        values: "1x20"
      - series: 'isardvdi_storage_governor_worker_psi_cpu{worker="workerM"}'
        values: "5x20"
      - series: 'isardvdi_storage_governor_worker_psi_io{worker="workerM"}'
        values: "5x20"
      - series: 'isardvdi_storage_governor_worker_psi_mem{worker="workerM"}'
        values: "90x20"
      - series: 'isardvdi_storage_governor_psi_limit'
        values: "40x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: storage_governor_alerts
        alertname: PSIPinned
        exp_alerts:
          - exp_labels:
              severity: warning
              worker: workerM
            exp_annotations:
              summary: "Storage worker pinned by PSI pressure"
              description: "Worker workerM has been deferring under CPU/IO/memory pressure above psi_limit for 15m (held by host stall, not the cap). The worker defers on any of the three axes, so all three are admitted here. Investigate storage-host load; scale the node or raise psi_limit only if the pressure is acceptable."

  # ---------------------------------------------------------------------------
  # A worker under the limit on every axis is not pinned, memory included.
  # ---------------------------------------------------------------------------
  - name: psi_pinned_silent_when_every_axis_is_under_the_limit
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_deferring{worker="workerQ"}'
        values: "1x20"
      - series: 'isardvdi_storage_governor_worker_psi_cpu{worker="workerQ"}'
        values: "5x20"
      - series: 'isardvdi_storage_governor_worker_psi_io{worker="workerQ"}'
        values: "5x20"
      - series: 'isardvdi_storage_governor_worker_psi_mem{worker="workerQ"}'
        values: "5x20"
      - series: 'isardvdi_storage_governor_psi_limit'
        values: "40x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: storage_governor_alerts
        alertname: PSIPinned
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # A truncated in-flight scan makes the leak gauges partial, so it has to reach
  # alerting rather than only the panel banner.
  # ---------------------------------------------------------------------------
  - name: inflight_scan_truncation_fires_after_30m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_truncated_inflight'
        values: "12x40"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: GovernorInflightScanTruncated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Governor in-flight leak scan is truncated"
              description: "12 in-flight members were dropped by the bounded leak-scan cap for 30m, so heavy_leak and category_leak are computed from a partial list. Reduce the in-flight backlog or raise the scan cap before trusting InflightLeak / CategoryInflightLeak."

  # ---------------------------------------------------------------------------
  # WorkerHeartbeatLost fires within its for: 2m window (up==0 held 3m).
  # ---------------------------------------------------------------------------
  # hash_present is carried for every worker row, so a test without it describes
  # no state the exporter can produce.
  - name: worker_heartbeat_lost_fires_within_2m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_up{worker="storage.default.background.def456",pool="default",kind="elastic"}'
        values: "0 0 0 0"
      - series: 'isardvdi_storage_governor_worker_hash_present{worker="storage.default.background.def456"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        groupname: storage_governor_alerts
        alertname: WorkerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: critical
              worker: storage.default.background.def456
              pool: default
              kind: elastic
            exp_annotations:
              summary: "Storage worker lost its heartbeat"
              description: "Worker storage.default.background.def456 (pool default, kind elastic) has reported up=0 for 2m with its rq:worker hash still present (heartbeat_age>420s). Restart the worker container; it may still hold slots until reconcile."

  # ---------------------------------------------------------------------------
  # NoStorageWorkers: every worker reporting up==0 -> sum==0 -> fires after 2m.
  # (When NO worker series exists at all, sum() yields no series and this cannot
  # fire — that blindness is GovernorScrapeFailed / GovernorExporterAbsent.)
  # ---------------------------------------------------------------------------
  - name: no_storage_workers_all_down_fires
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_up{worker="workerA",pool="default",kind="elastic"}'
        values: "0 0 0 0"
      - series: 'isardvdi_storage_governor_worker_up{worker="workerB",pool="default",kind="reserved"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        groupname: storage_governor_alerts
        alertname: NoStorageWorkers
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No storage workers are up"
              description: "No storage worker has reported up for 2m; nothing is draining the storage queues. Restart the worker containers."

  # The only fixture that can tell the filtered rule from the unfiltered one:
  # every other one gives each series a kind.
  - name: no_storage_workers_ignores_a_kindless_worker
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_up{worker="workerA",pool="default",kind="elastic"}'
        values: "0 0 0 0"
      - series: 'isardvdi_storage_governor_worker_up{worker="workerB",pool="default",kind="reserved"}'
        values: "0 0 0 0"
      # The notifier's RQ worker: up, and deliberately label-less.
      - series: 'isardvdi_storage_governor_worker_up{worker="notifier:isard-notifier:82795ba4"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        groupname: storage_governor_alerts
        alertname: NoStorageWorkers
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No storage workers are up"
              description: "No storage worker has reported up for 2m; nothing is draining the storage queues. Restart the worker containers."

  # ===========================================================================
  # TASK STREAMS — the finalize backlog no queue gauge can see.
  # ===========================================================================

  # A lag five times the threshold, drained after 25m, must NOT fire: the rule
  # discriminates on duration, not height. Lower the `for:` and this fails.
  - name: task_stream_lag_high_but_transient_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_lag{stream="stream:task-results",group="change-handler"}'
        values: "500x24 0x10"
    alert_rule_test:
      - eval_time: 33m
        groupname: storage_governor_alerts
        alertname: TaskStreamLagStuck
        exp_alerts: []

  - name: task_stream_lag_sustained_fires_after_30m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_lag{stream="stream:task-results",group="change-handler"}'
        values: "101x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: TaskStreamLagStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              stream: "stream:task-results"
              group: change-handler
            exp_annotations:
              summary: "Task-stream consumer group is not draining"
              description: "Group change-handler on stream:task-results has held a lag above 100 entries for 30m (101 now). Nothing settles the chains behind those entries, and no queue gauge can see it. Check the change-handler is alive and consuming; the threshold is below the healthy burst peak on purpose, so it is the 30m that makes this real, not the number."

  - name: task_stream_lag_at_threshold_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_lag{stream="stream:task-results",group="change-handler"}'
        values: "100x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: TaskStreamLagStuck
        exp_alerts: []

  # The backstop for a trim that erases the lag but not the pending list.
  - name: task_stream_pending_sustained_fires_after_30m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_pending{stream="stream:task-results",group="change-handler"}'
        values: "101x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: TaskStreamPendingStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              stream: "stream:task-results"
              group: change-handler
            exp_annotations:
              summary: "Task-stream entries are read but never acknowledged"
              description: "Group change-handler on stream:task-results has held over 100 unacknowledged entries for 30m (101 now). A consumer took them and did not finish; the reclaim pass should have taken them back. Check the change-handler for a wedged handler and the dead-letter stream for what it gave up on."

  # Boundary on the product's own RESULT_STREAM_HIGH_WATER: 90000 is not over it.
  - name: task_stream_backpressured_not_at_the_high_water_mark
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_results_length'
        values: "90000x10"
    alert_rule_test:
      - eval_time: 9m
        groupname: storage_governor_alerts
        alertname: TaskStreamBackpressured
        exp_alerts: []

  - name: task_stream_backpressured_fires_past_the_high_water_mark
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_results_length'
        values: "90001x10"
    alert_rule_test:
      - eval_time: 9m
        groupname: storage_governor_alerts
        alertname: TaskStreamBackpressured
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Task-result stream is at its backpressure high-water mark"
              description: "The result stream holds 90001 entries, past the 90000 high-water mark where enqueue is already being throttled, and 100000 is where unread results start being EVICTED (silent, unrecoverable loss of completions). Get the change-handler consuming again now."

  # A trim of the dead stream is a shrink and must read as zero.
  - name: task_stream_dead_letter_trim_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_dead_length'
        values: "30 30 30 30 30 30 30 30 30 30 30 30 30 0 0 0"
    alert_rule_test:
      - eval_time: 15m
        groupname: storage_governor_alerts
        alertname: TaskStreamDeadLettering
        exp_alerts: []

  - name: task_stream_dead_letter_growth_fires
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_dead_length'
        values: "0+1x14"
    alert_rule_test:
      - eval_time: 13m
        groupname: storage_governor_alerts
        alertname: TaskStreamDeadLettering
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Task results are being dead-lettered"
              description: "13 task results were dead-lettered in 15m: the consumer could not process them after every redelivery, so their chains will only be finalized by a reconcile pass, if at all. Read stream:task-results:dead and fix the handler that rejects them."

  # An idle group with no consumer is a deployment not started yet, not an
  # incident.
  - name: task_stream_no_consumers_without_lag_does_not_fire
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_consumers{stream="stream:task-results",group="change-handler"}'
        values: "0x35"
      - series: 'isardvdi_storage_governor_streams_group_lag{stream="stream:task-results",group="change-handler"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: TaskStreamNoConsumers
        exp_alerts: []

  - name: task_stream_no_consumers_with_lag_fires
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_group_consumers{stream="stream:task-results",group="change-handler"}'
        values: "0x35"
      - series: 'isardvdi_storage_governor_streams_group_lag{stream="stream:task-results",group="change-handler"}'
        values: "5x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: TaskStreamNoConsumers
        exp_alerts:
          - exp_labels:
              severity: critical
              stream: "stream:task-results"
              group: change-handler
            exp_annotations:
              summary: "Task-stream group has entries and no consumer at all"
              description: "Group change-handler on stream:task-results has unread entries and zero registered consumers for 30m. Nothing will ever finalize those chains. Start the change-handler. Note this alert cannot be early -- dead consumers stay registered for 12h -- so treat TaskStreamLagStuck as the detector and this as the confirmation."

  # A Redis outage is RedisDown's incident, not a second page for it.
  - name: task_streams_unreadable_silent_when_redis_is_down
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_up'
        values: "0x20"
      - series: 'isardvdi_storage_governor_redis_up'
        values: "0x20"
    alert_rule_test:
      - eval_time: 17m
        groupname: storage_governor_alerts
        alertname: TaskStreamsUnreadable
        exp_alerts: []

  - name: task_streams_unreadable_fires_while_redis_is_up
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_streams_up'
        values: "0x20"
      - series: 'isardvdi_storage_governor_redis_up'
        values: "1x20"
    alert_rule_test:
      - eval_time: 17m
        groupname: storage_governor_alerts
        alertname: TaskStreamsUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Task-stream health cannot be read while Redis is up"
              description: "The governor could not read the task streams for 15m even though the broker answers PING, so every stream gauge in this group is blind (their series are absent, not zero). Check XINFO/XLEN permissions and the stream keys."

  # ===========================================================================
  # STALE WORKER REGISTRATIONS — a corpse must not page for ever.
  # ===========================================================================

  # THE regression test: a registration with no worker behind it must not page.
  # Removing the hash_present gate makes this case fail.
  - name: worker_heartbeat_lost_silent_for_a_registration_with_no_worker
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_up{worker="storage-reserved:isard-storage:dead",pool="",kind=""}'
        values: "0x20"
      - series: 'isardvdi_storage_governor_worker_hash_present{worker="storage-reserved:isard-storage:dead"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        groupname: storage_governor_alerts
        alertname: WorkerHeartbeatLost
        exp_alerts: []

  # The case the alert is FOR, unchanged.
  - name: worker_heartbeat_lost_fires_while_the_hash_is_present
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_up{worker="storage-reserved:isard-storage:abc123",pool="default",kind="reserved"}'
        values: "0x20"
      - series: 'isardvdi_storage_governor_worker_hash_present{worker="storage-reserved:isard-storage:abc123"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 4m
        groupname: storage_governor_alerts
        alertname: WorkerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: critical
              worker: "storage-reserved:isard-storage:abc123"
              pool: default
              kind: reserved
            exp_annotations:
              summary: "Storage worker lost its heartbeat"
              description: "Worker storage-reserved:isard-storage:abc123 (pool default, kind reserved) has reported up=0 for 2m with its rq:worker hash still present (heartbeat_age>420s). Restart the worker container; it may still hold slots until reconcile."

  # The corpse still reaches an operator, as a warning, after 30m.
  - name: worker_registration_stale_fires_after_30m
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_hash_present{worker="storage-reserved:isard-storage:dead"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: WorkerRegistrationStale
        exp_alerts:
          - exp_labels:
              severity: warning
              worker: "storage-reserved:isard-storage:dead"
            exp_annotations:
              summary: "Stale worker registration with no worker behind it"
              description: "The rq:workers set has held a member for 30m whose rq:worker hash does not exist, so no worker is behind it. RQ only sweeps it through a queue a live worker still serves, so on a lane with no worker left it stays for ever: start a worker on that lane, or SREM the member. Until then every worker count that reads the set is too high by one."

  - name: worker_registration_stale_silent_while_the_hash_is_present
    interval: 1m
    input_series:
      - series: 'isardvdi_storage_governor_worker_hash_present{worker="storage-reserved:isard-storage:abc123"}'
        values: "1x35"
    alert_rule_test:
      - eval_time: 31m
        groupname: storage_governor_alerts
        alertname: WorkerRegistrationStale
        exp_alerts: []
