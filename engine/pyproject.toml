[project]
name = "isardvdi-engine"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "bcrypt==5.0.0",
  "cachetools==7.1.4",
  "flask==3.1.3",
  "humanfriendly==10.0",
  "isardvdi-apiv4-client",
  "isardvdi-changefeed-asyncapi",
  "isardvdi-common",
  "libpci==0.2",
  "libvirt-python==12.5.0",
  "lxml==6.1.1",
  "paramiko==5.0.0",
  "pem==23.1.0",
  "pyopenssl==26.3.0",
  "pyjwt==2.13.0",
  "pytz==2026.2",
  "redis==8.0.1",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/c8e870dcb3ba161189c682c1f20b8d439e381fdd.tar.gz",
  "schema==0.7.8",
  "tabulate==0.10.0",
  "werkzeug==3.1.8",
  "xmltodict==1.0.4",
  "yattag==1.16.1",
  "zstandard==0.25.0",
]

[dependency-groups]
test = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "libvirt-dev", "musl-dev", "openssl-dev", "pciutils-dev", "pkgconfig"]
apk-runtime = ["curl", "libffi", "libvirt-client", "libvirt-libs", "openssh-client", "openssl", "pciutils", "sshpass"]
