services:
  isard-grafana:
    container_name: isard-grafana
    image: ${DOCKER_IMAGE_PREFIX}grafana:${DOCKER_IMAGE_TAG-latest}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.15
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/isard/monitor/grafana/data:/var/lib/grafana
      - /opt/isard/monitor/grafana/custom:/custom
    restart: unless-stopped
    environment:
      DOMAIN:
      API_ISARDVDI_SECRET: "${API_ISARDVDI_SECRET}"
      VICTORIAMETRICS_ADDRESS: "${VICTORIAMETRICS_ADDRESS:-${PROMETHEUS_ADDRESS:-http://isard-victoriametrics:8428}}"
      LOKI_ADDRESS: "${LOKI_ADDRESS:-http://isard-loki:3100}"
      PYROSCOPE_ADDRESS: "${PYROSCOPE_ADDRESS:-http://isard-pyroscope:4040}"
      GRAFANA_TELEGRAM_CHAT_ID: "${GRAFANA_TELEGRAM_CHAT_ID}"
      GRAFANA_TELEGRAM_TOKEN: "${GRAFANA_TELEGRAM_TOKEN}"

  isard-victoriametrics:
    container_name: isard-victoriametrics
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    user: root
    volumes:
      - /opt/isard/stats/victoriametrics:/victoria-metrics-data
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.68
    restart: unless-stopped
    command: >-
      -storageDataPath=/victoria-metrics-data
      -retentionPeriod=${VICTORIAMETRICS_RETENTION_TIME:-${PROMETHEUS_RETENTION_TIME:-40d}}
      -selfScrapeInterval=30s
      -vmalert.proxyURL=http://isard-vmalert:8880
      -deleteAuthKey=${VICTORIAMETRICS_ADMIN_AUTH_KEY:-}
      -forceMergeAuthKey=${VICTORIAMETRICS_ADMIN_AUTH_KEY:-}

  isard-vmalert:
    container_name: isard-vmalert
    image: victoriametrics/vmalert:v1.154.0@sha256:f11d77f9ff68dfd63c871d0e59ae7b479f9c3fd0e8a685fef690fb88b794d938
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.69
    volumes:
      - ${BUILD_ROOT_PATH}/docker/vmalert/rules:/etc/vmalert/rules:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      - isard-victoriametrics
    command: >-
      -datasource.url=http://isard-victoriametrics:8428
      -remoteWrite.url=http://isard-victoriametrics:8428
      -remoteRead.url=http://isard-victoriametrics:8428
      -notifier.blackhole
      -rule=/etc/vmalert/rules/*.rules.yml
      -evaluationInterval=30s
      -external.label=source=vmalert

  isard-loki:
    container_name: isard-loki
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    user: root
    volumes:
      - /opt/isard/stats/loki:/data
      - ${BUILD_ROOT_PATH}/docker/loki/config.yaml:/etc/loki/local-config.yaml
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.67
    restart: unless-stopped
    stop_grace_period: 120s
    command: --config.file=/etc/loki/local-config.yaml --store.retention=${LOKI_RETENTION_TIME:-40d}
