services:
  isard-vpn:
    environment:
      PYTHONPATH: /opt/isardvdi
    volumes:
    # The package is installed non-editable into /.venv, so hot-reload comes
    # from shadowing it on PYTHONPATH, which wins over site-packages.
    - ${BUILD_ROOT_PATH}/docker/vpn/src/isardvdi_vpn:/opt/isardvdi/isardvdi_vpn
    - ${BUILD_ROOT_PATH}/docker/vpn/ovs:/ovs
    - ${BUILD_ROOT_PATH}/docker/vpn/dnsmasq-hook:/dnsmasq-hook
    - ${BUILD_ROOT_PATH}/docker/vpn/run.sh:/run.sh
    - ${BUILD_ROOT_PATH}/component/_common/src/isardvdi_common:/opt/isardvdi/isardvdi_common
    - ${BUILD_ROOT_PATH}/pkg/gen/asyncapi/changefeed:/opt/isardvdi/asyncapi_changefeed
    - ${BUILD_ROOT_PATH}/component/apiv4-client/src/isardvdi_apiv4_client:/opt/isardvdi/isardvdi_apiv4_client
    - ${BUILD_ROOT_PATH}/component/apiv4-client/src/isardvdi_apiv4_client_auth:/opt/isardvdi/isardvdi_apiv4_client_auth
    - ${BUILD_ROOT_PATH}/component/notifier-client/src/isardvdi_notifier_client:/opt/isardvdi/isardvdi_notifier_client
    - ${BUILD_ROOT_PATH}/component/notifier-client/src/isardvdi_notifier_client_auth:/opt/isardvdi/isardvdi_notifier_client_auth
    - ${BUILD_ROOT_PATH}/component/scheduler-client/src/isardvdi_scheduler_client:/opt/isardvdi/isardvdi_scheduler_client
    - ${BUILD_ROOT_PATH}/component/scheduler-client/src/isardvdi_scheduler_client_auth:/opt/isardvdi/isardvdi_scheduler_client_auth
