services:
  isard-engine:
    container_name: isard-engine
    image: ${DOCKER_IMAGE_PREFIX}engine:${DOCKER_IMAGE_TAG-latest}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.14
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/info" ]
      start_period: 5m
      interval: 5s
    volumes:
      - /opt/isard/certs/viewers:/certs:rw
      - /opt/isard/sshkeys:/root/.ssh:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - isard-db
      - isard-redis
    environment:
      REDIS_HOST: ${REDIS_HOST:-isard-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_ISARDVDI_SECRET:
      DOMAIN:
      ENGINE_DISK_BALANCER:
      ENGINE_HYPER_BALANCER: ${ENGINE_HYPER_BALANCER:-available_ram_percent}
      GPU_FAKE:
      LOG_LEVEL:
      QCOW2_CLUSTER_SIZE:
      QCOW2_EXTENDED_L2:
      QCOW2_LAZY_REFCOUNTS:
      QCOW2_PREALLOCATION:
      RETHINKDB_DB:
      RETHINKDB_HOST:
      RETHINKDB_PORT:
      # Engine uses the fork's ``ThreadSafeConnectionPool`` (P2 #7,
      # 2026-05-02) — own instance, distinct from `_common`'s shared
      # pool but with the same observer wiring. Env vars match the
      # rest of the Python stack so operators tune one knob:
      # - ``RETHINKDB_POOL_SIZE`` — engine is the heaviest rdb
      #   consumer (desktop balancer threads, hyper status threads,
      #   the changes cursor); 50-slot historical sizing kept.
      # - ``RETHINKDB_SLOW_QUERY_MS`` — slow-query threshold for the
      #   ``rdb_query_slow`` log line emitted by the observer wired
      #   into ``_connection_factory``.
      # - ``RETHINKDB_POOL_IDLE_SEC`` — idle eviction window
      #   (default 1800s in code; bumped from `_common`'s 300s
      #   because engine has long-quiet worker threads).
      # - ``RETHINKDB_ACQUIRE_TIMEOUT_SEC`` — pool exhaustion fast-
      #   fail (raises ``PoolExhaustedError``, a ``ReqlDriverError``
      #   subclass engine's outer reconnect loops catch).
      RETHINKDB_POOL_SIZE: ${RETHINKDB_POOL_SIZE:-50}
      RETHINKDB_SLOW_QUERY_MS: ${RETHINKDB_SLOW_QUERY_MS:-500}
      RETHINKDB_POOL_IDLE_SEC: ${RETHINKDB_POOL_IDLE_SEC:-1800}
      RETHINKDB_ACQUIRE_TIMEOUT_SEC: ${RETHINKDB_ACQUIRE_TIMEOUT_SEC:-30}
      STATS_RETHINKDB_PORT:
      TELEGRAM_ENGINE_CHAT_ID:
      TELEGRAM_ENGINE_TOKEN:
      WEBAPP_ADMIN_PWD:
      LOG_EXCEPT_ID_LEVEL:
      ENGINE_GUESTS_DISK_DRIVER_CACHE:
