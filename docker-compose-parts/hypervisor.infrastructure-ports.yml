services:
  isard-hypervisor:
    ports:
      # The engine reaches each hypervisor over SSH on 2022 to drive libvirt, so on a
      # multi-host install this port has to be published. It is an inter-host port with
      # no business on a public NIC, hence the infrastructure IP. The port apiv4 dials
      # is the one setup.py writes to the database ("port": "2022"), so the container's
      # sshd stays on 2022 and only the host side is bound.
      - "${INFRASTRUCTURE_HOST_IP:?INFRASTRUCTURE_HOST_IP must be a literal IP present on this host}:2022:2022"
