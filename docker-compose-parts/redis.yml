services:
  isard-redis:
    container_name: isard-redis
    image: redis:7.4-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    networks:
      isard-network:
        ipv4_address: ${DOCKER_NET:-172.31.255}.12
    volumes:
      - /opt/isard/redis/data:/data
    # An explicit --save replaces the compiled-in save points rather than adding
    # to them, so this line is the whole persistence policy.
    command: /bin/sh -c "redis-server --port \"$$REDIS_PORT\" --requirepass \"$$REDIS_PASSWORD\" --save \"3600 1 300 100 60 10000\" --stop-writes-on-bgsave-error yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli -p $$REDIS_PORT ping | grep PONG"]
      start_period: 5m
      interval: 5s
