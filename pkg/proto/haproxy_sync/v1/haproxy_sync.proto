syntax = "proto3";

package haproxy_sync.v1;

// HaproxySyncService manages HAProxy synchronization
// with new configuration, avoiding full HAProxy reloads.
service HaproxySyncService {
  // DomainSync performs a full synchronization of all the domains that the HAProxy needs to
  // accept and manage.
  rpc DomainSync(DomainSyncRequest) returns (DomainSyncResponse) {}

  // IssueMainDomain issues/renews the deployment's main certificate to the crt-list default,
  // touching neither the domain map nor the crt-list. Safe to call repeatedly (idempotent).
  rpc IssueMainDomain(IssueMainDomainRequest) returns (IssueMainDomainResponse) {}

  // BastionAddSubdomain adds a subdomain to subdomains.map
  rpc BastionAddSubdomain(BastionAddSubdomainRequest) returns (BastionAddSubdomainResponse) {}

  // BastionDeleteSubdomain removes a subdomain from subdomains.map
  rpc BastionDeleteSubdomain(BastionDeleteSubdomainRequest) returns (BastionDeleteSubdomainResponse) {}

  // BastionAddIndividualDomain adds a domain to individual.map
  rpc BastionAddIndividualDomain(BastionAddIndividualDomainRequest) returns (BastionAddIndividualDomainResponse) {}

  // BastionDeleteIndividualDomain removes a domain from individual.map
  rpc BastionDeleteIndividualDomain(BastionDeleteIndividualDomainRequest) returns (BastionDeleteIndividualDomainResponse) {}

  // BastionSyncMaps performs full synchronization of all maps
  rpc BastionSyncMaps(BastionSyncMapsRequest) returns (BastionSyncMapsResponse) {}

  // BastionGetCurrentMaps returns current HAProxy map state
  rpc BastionGetCurrentMaps(BastionGetCurrentMapsRequest) returns (BastionGetCurrentMapsResponse) {}
}

// DomainSyncDomain describes one per-category branding domain and how its certificate
// is obtained.
//
// The three sources are distinguished by which fields are set. A certificate means the
// operator supplied the PEM. All four acme_dns fields together mean DNS-01 through an
// acme-dns account, which is the only way to certify a name that does not point at this
// deployment. Neither means HTTP-01, which stays the default.
//
// The acme-dns fields are all-or-nothing on purpose: three of four cannot issue anything,
// and treating a partial set as "use DNS-01" turns a half-filled form into a failure deep
// inside acme.sh that talks about DNS rather than about configuration.
message DomainSyncDomain {
  string name = 1;
  bytes certificate = 2; // PEM. If empty and no acme_dns fields, issued via ACME HTTP-01.

  // acme-dns (DNS-01) credentials. Each domain carries its own registration: an acme-dns
  // account holds a bounded number of TXT records, so sharing one across domains would
  // have them evict each other's challenges.
  string acme_dns_base_url = 3;
  string acme_dns_username = 4;
  string acme_dns_password = 5;
  string acme_dns_subdomain = 6;
}

message DomainSyncRequest {
  repeated DomainSyncDomain domains = 1;
}

// IssueMainDomainRequest describes the certificate the deployment is served with.
// names is ordered; names[0] is the primary acme.sh indexes the certificate by.
// The four acme_dns fields are all-or-nothing: set together they route the challenge
// through acme-dns instead of HTTP.
message IssueMainDomainRequest {
  repeated string names = 1;
  string acme_email = 2;
  string acme_server = 3;

  string acme_dns_base_url = 4;
  string acme_dns_username = 5;
  string acme_dns_password = 6;
  string acme_dns_subdomain = 7;
}

message IssueMainDomainResponse {}

message DomainSyncResponse {
  int32 domains_added = 1;
  int32 domains_removed = 2;
  int32 certs_issued = 3;
  int32 certs_removed = 4;
  repeated DomainSyncError failed_domains = 5;
}

message DomainSyncError {
  string domain = 1;
  string error = 2;
}

message BastionAddSubdomainRequest {
  string domain = 1;
}

message BastionAddSubdomainResponse {}

message BastionDeleteSubdomainRequest {
  string domain = 1;
}

message BastionDeleteSubdomainResponse {}

message BastionAddIndividualDomainRequest {
  string domain = 1;
}

message BastionAddIndividualDomainResponse {}

message BastionDeleteIndividualDomainRequest {
  string domain = 1;
}

message BastionDeleteIndividualDomainResponse {}

message BastionSyncMapsRequest {
  repeated string subdomains = 1;
  repeated string individual_domains = 2;
}

message BastionSyncMapsResponse {
  int32 subdomains_added = 1;
  int32 subdomains_removed = 2;
  int32 individual_added = 3;
  int32 individual_removed = 4;
}

message BastionGetCurrentMapsRequest {}

message BastionGetCurrentMapsResponse {
  repeated string subdomains = 1;
  repeated string individual_domains = 2;
}
