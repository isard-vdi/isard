[project]
name = "isardvdi-protobuf"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "grpcio==1.82.1",
  "grpcio-tools==1.82.1",
  "grpcio-health-checking==1.82.1",
  "protobuf==7.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isardvdi_protobuf"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "musl-dev", "openssl-dev"]
apk-runtime = ["libffi", "openssl"]
