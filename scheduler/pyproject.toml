[project]
name = "isardvdi-scheduler"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "apscheduler==3.11.3",
  "flask==3.1.3",
  "flask-socketio==5.6.1",
  "gevent==26.5.0",
  "isardvdi-apiv4-client",
  "isardvdi-common",
  "pyjwt==2.13.0",
  "pytz==2026.2",
  "requests==2.34.2",
  "rethinkdb @ https://github.com/isard-vdi/rethinkdb-python/archive/de0aa01a894bc08c3d8ecb9333bec2eafe9fd504.tar.gz",
  "werkzeug==3.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.isardvdi.system-deps]
apk-build = ["build-base", "libffi-dev", "musl-dev", "openssl-dev"]
apk-runtime = ["curl", "libffi", "openssl", "tzdata"]

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]
